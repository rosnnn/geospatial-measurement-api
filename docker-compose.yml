version: "3.8"

services:
  geomeasure-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geomeasure-api
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Geospatial File Measurement API
      - DATABASE_URL=sqlite:///./geospatial.db
      - MAX_UPLOAD_SIZE_BYTES=52428800
    volumes:
      - ./uploads:/app/uploads
      - ./geospatial.db:/app/geospatial.db
    restart: unless-stopped
